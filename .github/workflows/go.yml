name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Build Server
      working-directory: ./server
      run: |
        go mod tidy
        go build -v ./...

    - name: Build Client
      working-directory: ./client
      run: |
        go mod tidy
        go build -v ./...